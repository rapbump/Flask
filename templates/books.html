<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='/css/books.css')}}">
    <title>Manage Books</title>
</head>

<body>
    <header>
        <h1>Admin - Manage Books</h1>
        <a href="{{url_for('admin_dashboard')}}">Back</a>
    </header>
    <main>
        <section class="add_books">
            <div class="sec_head">
                <h2>Add New Book</h2>
            </div>
            <form action="" method="POST">
                <div class="labels">
                    <label for="title">Title</label>
                    <input type="text" name="title">
                </div>
                <div class="labels">
                    <label for="author">Author</label>
                    <input type="text" name="author">
                </div>
                <div class="labels">
                    <label for="copies">Available Copies</label>
                    <input type="number" name="copies">
                </div>
                <button type="submit">Add Book</button>
            </form>
        </section>
        <section class="existing_books">
            <div class="sec_head">
                <h2>Existing Books</h2>
            </div>
            <div class="table_display">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Available Copies</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if books %}
                            {% for book in books %}
                            <tr>
                                <td>{{ book[0] }}</td>
                                <td>{{ book[1] }}</td>
                                <td>{{ book[2] }}</td>
                                <td>{{ book[3] }}</td>
                            </tr>
                            {% endfor %}
                        {% else %}
                        <tr>
                            <td colspan="4">No Books</td>
                        </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
